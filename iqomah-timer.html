<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Iqomah</title>
    <style>
        :root {
            --bg-color: #121212;
            --accent-color: #27ae60;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 1s;
        }

        #container { text-align: center; width: 90%; }

        h1 { font-size: 2rem; margin-bottom: 20px; }

        .setup-screen button {
            padding: 15px 30px;
            font-size: 1.2rem;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: var(--accent-color);
            color: white;
            transition: 0.3s;
        }

        .setup-screen button:hover { background-color: #219150; }

        #timer-display {
            font-size: 8rem;
            font-weight: bold;
            display: none;
        }

        #status-text {
            font-size: 2.5rem;
            margin-top: 20px;
            display: none;
        }

        /* Mode Layar Gelap */
        .sholat-mode {
            background-color: #000000 !important;
        }
        .sholat-mode #container { display: none; }
    </style>
</head>
<body>

    <div id="container">
        <div id="setup" class="setup-screen">
            <h1>Pilih Waktu Iqomah</h1>
            <button onclick="startTimer(10, 'Dhuhur')">Dhuhur (10 Menit)</button>
            <button onclick="startTimer(7, 'Ashar')">Ashar (7 Menit)</button>
            <p style="font-size: 0.8rem; color: #888;">*Pastikan volume HP aktif</p>
        </div>

        <div id="timer-display">00:00</div>
        <div id="status-text"></div>
    </div>

    <audio id="alarm">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        let countdown;
        const timerDisplay = document.getElementById('timer-display');
        const statusText = document.getElementById('status-text');
        const setupScreen = document.getElementById('setup');
        const alarm = document.getElementById('alarm');

        function startTimer(minutes, sholat) {
            setupScreen.style.display = 'none';
            timerDisplay.style.display = 'block';
            
            let seconds = minutes * 60;

            countdown = setInterval(() => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;

                timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                if (seconds <= 0) {
                    clearInterval(countdown);
                    finishTimer(sholat);
                }
                seconds--;
            }, 1000);
        }

        function finishTimer(sholat) {
            timerDisplay.style.display = 'none';
            statusText.style.display = 'block';
            statusText.textContent = `Selamat Menunaikan Sholat ${sholat}`;
            
            // Putar Alarm
            alarm.play();

            // Matikan alarm setelah 10 detik
            setTimeout(() => {
                alarm.pause();
                alarm.currentTime = 0;
            }, 10000);

            // Layar menjadi gelap setelah 15 detik (memberi waktu baca tulisan)
            setTimeout(() => {
                document.body.classList.add('sholat-mode');
            }, 15000);
        }
    </script>
</body>
</html>
